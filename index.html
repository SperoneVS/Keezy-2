<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neue Keezys 2 – Soundboard</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --danger-hover: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      max-width: 600px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 0.5rem;
      letter-spacing: -0.05em;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .controls {
      display: flex;
      gap: 1rem;
      width: 100%;
      max-width: 600px;
      margin-bottom: 2rem;
    }

    .search-bar {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid #334155;
      background-color: var(--card-bg);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar:focus {
      border-color: var(--accent);
    }

    .btn-stop {
      padding: 0.75rem 1.25rem;
      border: none;
      border-radius: 0.5rem;
      background-color: var(--danger);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-stop:hover {
      background-color: var(--danger-hover);
    }

    .btn-stop:active {
      transform: scale(0.98);
    }

    .soundboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
      width: 100%;
      max-width: 900px;
    }

    .sound-card {
      background-color: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      min-height: 110px;
    }

    .sound-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .sound-card:active, .sound-card.playing {
      transform: scale(0.96);
      background-color: #27354a;
      border-color: var(--accent);
    }

    .sound-title {
      font-weight: 600;
      font-size: 1.05rem;
      line-height: 1.3;
    }

    footer {
      margin-top: auto;
      padding-top: 3rem;
      color: var(--text-muted);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Neue Keezys 2</h1>
    <p class="subtitle">Klicke auf einen Button, um den Sound abzuspielen.</p>
  </header>

  <div class="controls">
    <input 
      type="text" 
      id="searchInput" 
      class="search-bar" 
      placeholder="Sounds durchsuchen..." 
      aria-label="Sounds durchsuchen"
    >
    <button id="stopAllBtn" class="btn-stop">Stopp</button>
  </div>

  <main class="soundboard-grid" id="grid">
    <!-- Príklady nemeckých hlášok a zvukov; atribút data-sound nahraď cestou k vlastnému .mp3 súboru -->
    <button class="sound-card" data-sound="sounds/keez_1.mp3">
      <span class="sound-title">Keezy Los!</span>
    </button>

    <button class="sound-card" data-sound="sounds/keez_2.mp3">
      <span class="sound-title">Was geht ab?</span>
    </button>

    <button class="sound-card" data-sound="sounds/keez_3.mp3">
      <span class="sound-title">Nicht dein Ernst</span>
    </button>

    <button class="sound-card" data-sound="sounds/keez_4.mp3">
      <span class="sound-title">Absoluter Wahnsinn</span>
    </button>

    <button class="sound-card" data-sound="sounds/keez_5.mp3">
      <span class="sound-title">Hau rein!</span>
    </button>

    <button class="sound-card" data-sound="sounds/keez_6.mp3">
      <span class="sound-title">Kein Problem</span>
    </button>

    <button class="sound-card" data-sound="sounds/keez_7.mp3">
      <span class="sound-title">Legende</span>
    </button>

    <button class="sound-card" data-sound="sounds/keez_8.mp3">
      <span class="sound-title">Tschüss!</span>
    </button>
  </main>

  <footer>
    <p>&copy; 2026 Neue Keezys Soundboard. Alle Rechte vorbehalten.</p>
  </footer>

  <script>
    let currentAudio = null;
    let activeCard = null;

    const cards = document.querySelectorAll('.sound-card');
    const stopBtn = document.getElementById('stopAllBtn');
    const searchInput = document.getElementById('searchInput');

    // Prehrávanie zvukov
    cards.forEach(card => {
      card.addEventListener('click', () => {
        const soundSrc = card.getAttribute('data-sound');
        
        // Zastavenie predchádzajúceho zvuku
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
          if (activeCard) activeCard.classList.remove('playing');
        }

        // Vytvorenie a prehratie nového zvuku
        currentAudio = new Audio(soundSrc);
        activeCard = card;
        card.classList.add('playing');

        currentAudio.play().catch(err => {
          console.warn('Wiedergabe fehlgeschlagen (evtl. fehlt die Audiodatei):', err);
          card.classList.remove('playing');
        });

        currentAudio.onended = () => {
          card.classList.remove('playing');
          activeCard = null;
        };
      });
    });

    // Zastavenie zvuku tlačidlom Stopp
    stopBtn.addEventListener('click', () => {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        if (activeCard) activeCard.classList.remove('playing');
      }
    });

    // Filtrovanie zvukov cez vyhľadávač
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      cards.forEach(card => {
        const title = card.querySelector('.sound-title').textContent.toLowerCase();
        if (title.includes(query)) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    });
  </script>
</body>
</html>
